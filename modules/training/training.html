<section class="card">
  <div class="vs-page-header">
    <div class="vs-page-header-left">
      <nav class="vs-page-breadcrumb" aria-label="Breadcrumb">
        <span>VAMS Portal</span>
        <span class="vs-page-breadcrumb-sep">/</span>
        <span class="vs-page-breadcrumb-current">Training</span>
      </nav>
      <h1 class="vs-page-title">Training & Currency</h1>
      <p class="vs-page-subtitle">Live training center, offering, and booking data from Firestore.</p>
    </div>
    <div class="vs-page-header-right">
      <span id="training-status" class="vs-page-chip">Loading training records...</span>
    </div>
  </div>

  <div class="vs-kpi-grid vs-kpi-grid--fixed" id="training-summary">
    <div class="vs-kpi-card">
      <strong class="vs-kpi-value" id="training-centers-total">0</strong>
      <span class="vs-kpi-label">Centers</span>
    </div>
    <div class="vs-kpi-card">
      <strong class="vs-kpi-value" id="training-offerings-total">0</strong>
      <span class="vs-kpi-label">Offerings</span>
    </div>
    <div class="vs-kpi-card">
      <strong class="vs-kpi-value" id="training-bookings-total">0</strong>
      <span class="vs-kpi-label">Bookings</span>
    </div>
    <div class="vs-kpi-card">
      <strong class="vs-kpi-value" id="training-pending-total">0</strong>
      <span class="vs-kpi-label">Pending Approvals</span>
    </div>
  </div>
</section>

<section class="card">
  <h3>Recent Bookings</h3>
  <div class="training-table-wrap">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Offering</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="training-bookings-body"></tbody>
    </table>
  </div>
</section>
