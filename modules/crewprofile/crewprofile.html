<section class="card crew-profile-shell">
  <div class="crew-profile-head">
    <a href="#/crew" class="crew-profile-back">Back to Crew</a>
    <div class="crew-profile-heading">
      <h2 id="crew-profile-name">Crew Profile</h2>
      <p id="crew-profile-subtitle" class="muted">Loading crew profile...</p>
    </div>
    <span id="crew-profile-status" class="crew-profile-status">Pending</span>
  </div>

  <div class="crew-profile-kpis" id="crew-profile-kpis"></div>

  <div class="crew-profile-tabs" role="tablist" aria-label="Crew profile tabs">
    <button type="button" class="crew-tab active" data-tab="personal" role="tab" aria-selected="true">Personal</button>
    <button type="button" class="crew-tab" data-tab="documents" role="tab" aria-selected="false">Documents</button>
    <button type="button" class="crew-tab" data-tab="training" role="tab" aria-selected="false">Training</button>
    <button type="button" class="crew-tab" data-tab="experience" role="tab" aria-selected="false">Flight Experience</button>
    <button type="button" class="crew-tab" data-tab="connections" role="tab" aria-selected="false">Connections</button>
    <button type="button" class="crew-tab" data-tab="history" role="tab" aria-selected="false">History</button>
  </div>

  <section class="crew-tab-panel active" data-panel="personal" role="tabpanel">
    <div class="crew-profile-grid" id="crew-profile-grid"></div>
  </section>

  <section class="crew-tab-panel" data-panel="documents" role="tabpanel">
    <div class="crew-profile-table-wrap">
      <table class="crew-profile-table">
        <thead>
          <tr>
            <th>Category</th>
            <th>Name</th>
            <th>Number</th>
            <th>Issue</th>
            <th>Expiry</th>
            <th>Status</th>
            <th>Last Edited</th>
          </tr>
        </thead>
        <tbody id="crew-profile-doc-body"></tbody>
      </table>
    </div>
  </section>

  <section class="crew-tab-panel" data-panel="training" role="tabpanel">
    <div class="crew-profile-table-wrap">
      <table class="crew-profile-table">
        <thead>
          <tr>
            <th>Training</th>
            <th>Completed</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Reference</th>
          </tr>
        </thead>
        <tbody id="crew-profile-training-body"></tbody>
      </table>
    </div>
  </section>

  <section class="crew-tab-panel" data-panel="experience" role="tabpanel">
    <div class="crew-profile-grid" id="crew-profile-experience-grid"></div>
  </section>

  <section class="crew-tab-panel" data-panel="connections" role="tabpanel">
    <div id="crew-profile-connections" class="crew-profile-connections"></div>
  </section>

  <section class="crew-tab-panel" data-panel="history" role="tabpanel">
    <div class="crew-profile-table-wrap">
      <table class="crew-profile-table">
        <thead>
          <tr>
            <th>When</th>
            <th>Event</th>
            <th>Source</th>
            <th>Edited By</th>
          </tr>
        </thead>
        <tbody id="crew-profile-history-body"></tbody>
      </table>
    </div>
  </section>
</section>
