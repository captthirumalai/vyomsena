<section class="card">
  <div class="vs-kpi-grid vs-kpi-grid--fixed" id="weather-summary">
    <div class="vs-kpi-card is-good">
      <strong class="vs-kpi-value" id="weather-risk-level">GREEN</strong>
      <span class="vs-kpi-label">Operational Risk Level</span>
    </div>
    <div class="vs-kpi-card">
      <strong class="vs-kpi-value" id="weather-maintenance-impact">0</strong>
      <span class="vs-kpi-label">Aircraft Constraints</span>
    </div>
    <div class="vs-kpi-card">
      <strong class="vs-kpi-value" id="weather-crew-impact">0</strong>
      <span class="vs-kpi-label">Crew Document Constraints</span>
    </div>
    <div class="vs-kpi-card">
      <strong class="vs-kpi-value" id="weather-ready-score">0%</strong>
      <span class="vs-kpi-label">Readiness Score</span>
    </div>
  </div>
</section>

<section class="card">
  <h3>Constraint Watchlist</h3>
  <div class="weather-table-wrap">
    <table>
      <thead>
        <tr>
          <th>Category</th>
          <th>Reference</th>
          <th>Impact</th>
          <th>Level</th>
        </tr>
      </thead>
      <tbody id="weather-watchlist-body"></tbody>
    </table>
  </div>
</section>
